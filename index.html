<style>

.hotspot:hover,.hotspot:focus-visible{background:rgba(255,255,255,.16);border-color:var(--hs,#fff);box-shadow:0 0 0 3px rgba(0,0,0,.18),0 0 22px rgba(255,255,255,.25);outline:none}

.hotspot:hover .tip,.hotspot:focus-visible .tip{opacity:1}
.topline{display:flex;align-items:center;gap:10px;color:#cfe3d6;font-size:12.5px;padding:6px 4px 2px}.topline .grow{flex:1}

.fliphost{width:100%;display:flex;align-items:center;justify-content:center;min-height:56vh}
.book-pg{background:#fff}
.book-pg img{width:100%;height:100%;object-fit:contain;display:block}
/* fallback geser */
.book.as-gallery{display:flex;width:100%;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;border-radius:14px;-webkit-overflow-scrolling:touch;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.book.as-gallery .book-pg{flex:0 0 100%;scroll-snap-align:center;border-radius:12px;overflow:hidden}

.feat .lbl{display:inline-flex;gap:7px;font-size:11px;font-weight:800;color:#fff;border-radius:999px;padding:4px 10px;margin-bottom:8px}

.btn{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:11px;background:var(--forest);color:#fff;padding:10px 14px;cursor:pointer}

textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;resize:vertical;min-height:70px;margin-bottom:8px}
.key{display:none;margin-top:9px;font-size:13px;background:var(--amber-soft);color:var(--amber);border-radius:11px;padding:10px 12px}.key.show{display:block}
.slot{font-size:11.5px;color:var(--muted);margin-top:9px;border-top:1px dashed var(--line);padding-top:8px}
.modal{position:fixed;inset:0;background:var(--panel);color:var(--ink);z-index:60;display:none;overflow-y:auto}.modal.open{display:block}
.modal .inner{max-width:560px;margin:0 auto;padding:18px 16px 60px}
.modal .close{position:sticky;top:8px;margin-left:auto;display:block;background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}
.modal h2{font-size:20px;margin:2px 0 4px}.modal .sub{font-size:13px;color:var(--muted);margin:0}
.bar{height:8px;border-radius:99px;background:var(--line);margin:14px 0 4px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),#7FB84C 55%,var(--amber));transition:.4s}
.prow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}.q .num{font-size:12px;font-weight:700;color:var(--leaf)}.q .stem{font-size:15px;font-weight:600;margin:6px 0 10px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14px;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;margin:7px 0;cursor:pointer}
.opt.correct{border-color:var(--leaf);background:var(--leaf-soft);font-weight:700}.opt.wrong{border-color:var(--amber);background:var(--amber-soft)}
.fb{margin-top:9px;font-size:13px;border-radius:11px;padding:10px 12px;display:none}.fb.show{display:block}.fb.ok{background:var(--leaf-soft);color:var(--forest)}.fb.no{background:var(--amber-soft);color:var(--amber)}
.chip{display:inline-block;margin-top:7px;font-size:11px;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:3px 9px;border-radius:99px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

function show(id){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
setImg(document.getElementById('shelfimg'),fileCands('rak-buku'));
(function(){var s=document.getElementById('shelf');LANDING_HS.forEach(function(b){var e=document.createElement('button');e.className='hotspot';e.style.cssText='top:'+b.t+'%;left:'+b.l+'%;width:'+b.w+'%;height:'+b.h+'%;--hs:'+b.c;e.innerHTML='<span class="tip">Volume '+b.v+'</span>';e.onclick=function(){openMap(b.v);};s.appendChild(e);});})();
function openMap(v){var V=VOL[v];setImg(document.getElementById('mapimg'),fileCands('peta-vol'+v));document.getElementById('mapcap').textContent='Volume '+v+' · '+V.title;
 var w=document.getElementById('mapwrap');w.querySelectorAll('.hotspot').forEach(function(n){n.remove();});
 V.hs.forEach(function(h){var e=document.createElement('button');e.className='hotspot';e.style.cssText='top:'+h[1]+'%;left:'+h[2]+'%;width:'+h[3]+'%;height:'+h[4]+'%;--hs:'+V.c;e.innerHTML='<span class="tip">'+h[0]+'</span>';e.onclick=function(){openReader(v,h[0],h[5]);};w.appendChild(e);});

 show('map');}

var flip=null,fbCount=0;
function clearFlip(){if(flip){try{flip.destroy();}catch(e){}flip=null;}}
function updCounter(cur,n){document.getElementById('counter').textContent='Halaman '+cur+' / '+n;}
function renderReader(V,list){
 var host=document.getElementById('fliphost');host.innerHTML='';clearFlip();fbCount=(list&&list.length)||0;
 if(!V.dir||!fbCount){host.innerHTML='<div class="ph2">Konten belum tersedia</div>';document.getElementById('counter').textContent='';return;}
 var book=document.createElement('div');book.className='book';host.appendChild(book);
 list.forEach(function(num){var pg=document.createElement('div');pg.className='book-pg';var im=document.createElement('img');im.alt='Halaman '+num;setImg(im,pageCands(V.dir,num,V.ext));pg.appendChild(im);book.appendChild(pg);});
 var useFlip=!!(window.St&&window.St.PageFlip);
 if(useFlip){try{
   flip=new St.PageFlip(book,{width:430,height:573,size:'stretch',minWidth:240,maxWidth:700,minHeight:320,maxHeight:940,maxShadowOpacity:.5,showCover:false,usePortrait:true,mobileScrollSupport:false,flippingTime:650});
   flip.loadFromHTML(book.querySelectorAll('.book-pg'));
   updCounter(1,fbCount);
   flip.on('flip',function(e){var p=(e.data|0)+1;updCounter(p>fbCount?fbCount:p,fbCount);});
 }catch(err){useFlip=false;clearFlip();}}
 if(!useFlip){book.classList.add('as-gallery');updCounter(1,fbCount);
   book.onscroll=function(){clearTimeout(book._t);book._t=setTimeout(function(){var c=book.getBoundingClientRect(),cx=c.left+c.width/2,best=1,bd=1e9;Array.prototype.forEach.call(book.children,function(ch,i){var rr=ch.getBoundingClientRect(),d=Math.abs(rr.left+rr.width/2-cx);if(d<bd){bd=d;best=i+1;}});updCounter(best,fbCount);},70);};}
 document.getElementById('prevBtn').onclick=function(){if(flip){flip.flipPrev();}else{book.scrollBy({left:-book.clientWidth,behavior:'smooth'});}};
 document.getElementById('nextBtn').onclick=function(){if(flip){flip.flipNext();}else{book.scrollBy({left:book.clientWidth,behavior:'smooth'});}};
}
function openReader(v,key,title){var V=VOL[v];document.documentElement.style.setProperty('--vc',V.c);

 document.getElementById('rtitle').textContent=title;
 var all=key==='__all__';var list=all?V.all:(V.map[key]||[]);
 document.getElementById('rmode').textContent=all?('Mode: satu volume penuh — '+V.all.length+' halaman'):('Mode: subbab '+key);
 var fb=document.getElementById('featbox');
 fb.innerHTML = all ? '' :
  '<div class="feat"><span class="lbl" style="background:#c0392b">📱 Scan &amp; Eksplorasi</span><h3>Video pengayaan</h3><p>Tautan YouTube untuk subbab ini (isi URL pilihan Anda).</p><button class="btn alt" id="ytBtn">▶ Buka video (YouTube)</button></div>'
 +'<div class="feat"><span class="lbl" style="background:#2E9E57">✏️ Ayo Berpikir Kritis</span><h3>Jawab &amp; cek kunci</h3><textarea id="bk" placeholder="Tuliskan analisismu…"></textarea><button class="btn ghost" id="bkKey">Lihat kunci</button><div class="key" id="bkOut">Kunci/pembahasan subbab ini (diisi per subbab).</div><div class="slot">Slot: jawaban dapat dikirim ke Google Sheet Anda.</div></div>'
 +'<div class="feat"><span class="lbl" style="background:#16663C">✅ Cek Pemahaman</span><h3>Kuis akhir subbab</h3><p>Kuis berumpan balik (contoh: soal Vol 6).</p><button class="btn" id="openQuiz">Mulai Cek Pemahaman</button><div class="slot">Slot: skor &amp; angket dikirim ke Google Sheet untuk analisis.</div></div>';
 if(!all){var topic=encodeURIComponent(title+' fisika SMA');
  document.getElementById('ytBtn').onclick=function(){window.open('https://www.youtube.com/results?search_query='+topic,'_blank');};
  document.getElementById('bkKey').onclick=function(){document.getElementById('bkOut').classList.add('show');};
  document.getElementById('openQuiz').onclick=function(){document.getElementById('modal').classList.add('open');};}
 document.getElementById('backmap').onclick=function(){openMap(v);};
 show('reader');
 renderReader(V,list);
}
